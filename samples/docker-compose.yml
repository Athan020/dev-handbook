# Infrastructure for the handbook labs. Start it with `docker compose up -d` in samples/.
# Postgres is published on 5433 so it doesn't clash with a local Postgres on 5432.
# Development-only credentials: never reuse these anywhere real.
services:
  postgres:
    image: postgres:18.6-alpine
    # pg_stat_statements records how often each query runs and how long it takes (B1 stage 1).
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      # Also allows replication connections from the read replica (B1 stage 6).
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    # Docker's default 64 MB of shared memory is too little for parallel queries and big
    # sorts under load ("could not resize shared memory segment ... No space left on device").
    shm_size: 1gb
    environment:
      POSTGRES_DB: bank
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: bank
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank -d bank"]
      interval: 2s
      timeout: 3s
      retries: 30

  # A streaming-replication read replica (B1 stage 6). It only starts with the profile:
  #   docker compose --profile replica up -d
  # Set REPLICA_DELAY (milliseconds) to hold back applying changes, e.g.
  #   REPLICA_DELAY=2000 docker compose --profile replica up -d
  postgres-replica:
    image: postgres:18.6-alpine
    profiles: [replica]
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/replica-entrypoint.sh"]
    environment:
      PGPASSWORD: bank
      REPLICA_DELAY: ${REPLICA_DELAY:-0}
    ports:
      - "5434:5432"
    shm_size: 1gb
    volumes:
      - replica-data:/var/lib/postgresql
      - ./postgres/replica-entrypoint.sh:/replica-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank -d bank"]
      interval: 2s
      timeout: 3s
      retries: 300

volumes:
  postgres-data:
  replica-data:
